name: zuraffa_tui
description: >-
  Pure-Dart terminal UI runtime for Zuraffa — nocterm-based screens, widgets,
  DI resolver, bindings, and the `zfa tdd theater` replay, extracted from the
  core package so apps that never render a TUI stop inheriting nocterm and
  its dependency tree (zuraffa #393 / #1661).
version: 7.3.2
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_tui
issue_tracker: https://github.com/arrrrny/zuraffa_tui/issues
topics:
  - terminal
  - tui
  - cli
  - zuraffa

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.7.0
  get_it: ^9.2.1
  meta: ^1.19.0
  path: ^1.9.1
  # The terminal rendering engine. Pure Dart — no package:flutter (FR-012).
  nocterm: ^0.9.0
  zuraffa: ^7.3.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.33.0

dependency_overrides:
  # Fleet-wide xml policy (see ../zuraffa/scripts/update_fleet.sh).
  xml: 7.1.0
  # Dev mode: resolve the core against the sibling checkout.
  zuraffa:
    path: ../zuraffa

executables:
  zuraffa_tui:
